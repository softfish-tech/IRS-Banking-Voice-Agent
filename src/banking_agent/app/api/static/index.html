<style>

#auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 20%,#ecf4ff 0,transparent 33%),#f9fafb}#auth[hidden]{display:none}.auth-card{width:min(440px,100%);padding:32px;border:1px solid #e6eaf0;border-radius:18px;background:#fff;box-shadow:0 20px 60px #243a5714}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#1767d9;color:#fff;font-size:15px}.auth-card h1{margin:22px 0 6px;font-size:1.65rem;letter-spacing:-.04em}.muted{margin:0;color:#64748b;font-size:.92rem;line-height:1.5}.field{display:block;margin-top:20px;color:#334155;font-size:.88rem;font-weight:650}.field input,.field textarea,.field select{display:block;width:100%;margin-top:7px;padding:11px 12px;border:1px solid #d5dce6;border-radius:10px;background:#fff;color:#182230;outline:none}.field textarea{resize:vertical;min-height:84px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#1767d9;box-shadow:0 0 0 3px #1767d922}.button-row{display:flex;gap:10px;margin-top:22px}.button{border:0;border-radius:10px;padding:10px 14px;background:#1767d9;color:#fff;font-weight:700}.button:hover{background:#115bbf}.button.secondary{background:#f0f3f7;color:#334155}.button.danger{background:#b3261e}.profile-picker{display:grid;gap:8px;margin-top:15px}.profile-picker[hidden]{display:none}.profile-option{padding:12px;border:1px solid #dbe2eb;border-radius:10px;background:#fff;color:#182230;text-align:left}.profile-option:hover{background:#f8fbff}.profile-option.selected{border:2px solid #1767d9;background:#f4f8ff}.profile-option strong,.profile-option span{display:block}.profile-option span{margin-top:4px;color:#64748b;font-size:.8rem}

.workspace{position:relative;display:flex;flex-direction:column;min-width:0;min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:66px;padding:0 28px;border-bottom:1px solid #eef0f3}.topbar h1{overflow:hidden;margin:0;font-size:1rem;font-weight:680;text-overflow:ellipsis;white-space:nowrap}.topbar .status{color:#8793a3;font-size:.8rem}.thread{width:min(820px,100%);flex:1;margin:0 auto;padding:30px 26px 180px}.empty-state{display:grid;place-items:center;min-height:48vh;color:#718096;text-align:center}.empty-state strong{display:block;margin-bottom:7px;color:#263548;font-size:1.1rem}.message{display:flex;gap:13px;margin:0 0 28px;line-height:1.58}.avatar{flex:0 0 30px;height:30px;border-radius:9px;text-align:center;line-height:30px;font-size:.8rem;font-weight:800}.message.user{flex-direction:row-reverse}.message.user .avatar{background:#e9eff8;color:#526174}.message.assistant .avatar{background:#1767d9;color:#fff}.message-body{min-width:0;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}.message.user .message-body{padding:10px 13px;border-radius:14px 3px 14px 14px;background:#f0f3f7;color:#243246}.response-label{margin-bottom:6px;color:#8793a3;font-size:.72rem;font-weight:750;letter-spacing:.07em;text-transform:uppercase}.assistant .message-body{padding-top:3px}.status-card{margin-top:2px;padding:15px 16px;border:1px solid #e1e7ee;border-radius:12px;background:#f9fafb;box-shadow:0 2px 8px #17203308}.status-card .response-label{color:#667a90}.assistant.clarification .status-card{border-color:#efd9a6;background:#fffaf0}.assistant.escalation .status-card{border-color:#b9d4f3;background:#f4f9ff}.assistant.complaint .status-card{border-color:#c8d8ee;background:#f5f9fe}.assistant.blocked .status-card{border-color:#f0c5c1;background:#fff7f6}.assistant.abstention .status-card{border-color:#e5d8b6;background:#fffcf5}.assistant.recommendation .status-card{border-color:#c7e4d6;background:#f4fbf7}.action-hint{margin:10px 0 0;color:#64748b;font-size:.87rem}.source-details{margin-top:14px;font-size:.84rem}.source-details summary{color:#526174;cursor:pointer}.source-list,.recommendation-list{margin:8px 0 0;padding-left:18px;color:#526174}.recommendation-list li{margin:7px 0}.composer-dock{position:fixed;z-index:5;right:0;bottom:0;left:264px;padding:16px 26px 22px;background:linear-gradient(transparent,#fff 28%)}.composer{display:flex;align-items:flex-end;gap:10px;width:min(820px,100%);margin:auto;padding:10px;border:1px solid #dce2ea;border-radius:16px;background:#fff;box-shadow:0 8px 30px #1d2d4217}.composer textarea{flex:1;min-height:42px;max-height:150px;padding:10px;border:0;outline:0;resize:none;line-height:1.45}.composer .button{margin:0;white-space:nowrap}.voice-button{padding:10px;border:0;border-radius:10px;background:#eef3f9;color:#315a87;font-weight:650}.voice-button.recording{background:#ffe9e8;color:#aa2925}.voice-panel{width:min(820px,100%);margin:8px auto 0;padding:10px 14px;border:1px solid #d9e3ef;border-radius:12px;background:#f7faff;color:#526174;font-size:.85rem}.voice-panel[hidden]{display:none}.voice-status{display:block}.voice-review{margin-top:9px}.voice-review textarea{width:100%;margin:6px 0;padding:8px;border:1px solid #cbd7e5;border-radius:8px}.voice-review .button{margin:0 6px 0 0;padding:7px 9px;font-size:.82rem}#start-area{position:absolute;z-index:4;top:66px;right:0;bottom:0;left:0;background:#fff}.start-panel{width:min(650px,100%);margin:11vh auto 0;padding:0 22px}.start-panel h2{margin:0 0 8px;font-size:1.65rem;letter-spacing:-.04em}.start-panel .composer{width:100%;margin-top:22px}.fixture-panel{padding:20px}.fixture-panel select{width:100%;margin:9px 0;border:1px solid #d5dce6;border-radius:9px;padding:10px}.fixture-panel .button{margin:0}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 16px}.thread{padding:22px 16px 160px}.composer-dock{left:0;padding:12px 12px 17px}.message-body{max-width:92%}.start-panel{margin-top:8vh;padding:0 16px}}
</style></head><body>
<p id="error" role="alert" hidden></p><section id="auth"><div class="auth-card"><div class="brand"><span class="brand-mark">N</span>NovaGuide</div><h1>Welcome back</h1><p class="muted">Sign in to continue your conversation.</p><label class="field">Username<input id="username" autocomplete="username" placeholder="At least 3 letters, numbers, _ or -"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label><div id="profile-picker" class="profile-picker" hidden></div><div class="button-row"><button class="button" id="login">Sign in</button><button class="button secondary" id="register">Create account</button></div></div></section>
<section id="app"><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">N</span>NovaGuide</div><button class="button new-chat" id="new-chat">+ New conversation</button><div class="sidebar-label">Recent</div><div id="conversations" class="conversations"></div><div class="account"><div id="who" class="who"></div><button id="logout" class="signout">Sign out</button></div></aside><section class="workspace"><header class="topbar"><h1 id="conversation-title">New conversation</h1><span class="status">NovaGuide assistant</span></header><main id="messages" class="thread"></main><div id="start-area"></div><div id="run-box" class="composer-dock" hidden></div></section></div></section>
<script>
const $=s=>document.querySelector(s),error=$('#error');let scenarios=[],syntheticProfiles=[],selectedProfileId='',registering=false,current=null,moduleMode='fixture',voiceAvailable=false,recorder=null,recordStream=null,recordParts=[],recordingTimer=null;
const kindLabel={answer:'Answer',complaint:'Support request',escalation:'Human assistance',clarification:'A quick question',blocked:'Unavailable',abstention:'Unable to confirm',recommendation:'Recommendation',technical_error:'Technical issue'};const userFacingError={invalid_credentials:'Incorrect username or password.',username_and_password_must_be_strings:'Enter a username and password.',username_must_be_3_to_64_safe_characters:'Username must be 3–64 characters and use only letters, numbers, _ or -.',password_must_be_at_least_6_characters:'Password must contain at least 6 characters.',username_already_exists:'This username is already in use.',valid_synthetic_profile_key_required:'Choose a scenario before creating an account.',synthetic_profile_key_required:'This account needs a scenario before starting a conversation.',conversation_version_conflict:'This conversation changed in another request. Please review the latest messages and try again.',audio_too_large:'The recording is too large.',audio_too_long:'The recording is too long.',asr_unavailable:'Voice transcription is unavailable.'};
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}function element(name,text='',className=''){const n=document.createElement(name);if(text)n.textContent=text;if(className)n.className=className;return n}function showError(message=''){error.hidden=!message;error.textContent=message?`Unable to continue: ${userFacingError[message]||'Please try again.'}`:''}async function request(url,options={}){const headers=new Headers(options.headers||{});if(options.json!==false&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');const r=await fetch(url,{...options,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'request_failed');return d}function profileDetail(p){return `Age ${p.age} · ${p.residency} · ${p.available_deposit_display} · ${p.goal}`}function renderProfiles(){const picker=$('#profile-picker');clear(picker);if(!selectedProfileId&&syntheticProfiles.length)selectedProfileId=syntheticProfiles[0].id;for(const p of syntheticProfiles){const opt=element('button','',`profile-option${p.id===selectedProfileId?' selected':''}`);opt.type='button';opt.append(element('strong',p.label),element('span',profileDetail(p)));opt.onclick=()=>{selectedProfileId=p.id;renderProfiles()};picker.append(opt)}}
function makeComposer(id,placeholder,label){const wrap=element('div','','composer'),input=element('textarea','');input.id=id;input.maxLength=2000;input.placeholder=placeholder;input.setAttribute('aria-label',label);const voice=element('button','Voice','voice-button voice-start'),send=element('button',label,'button');voice.type=send.type='button';voice.dataset.target=id;wrap.append(input,voice,send);return{wrap,input,voice,send}}function makeVoicePanel(target){const p=element('div','','voice-panel');p.hidden=true;const status=element('span','','voice-status'),review=element('div','','voice-review'),text=element('textarea',''),use=element('button','Use text','button'),again=element('button','Record again','button secondary');review.hidden=true;text.maxLength=2000;text.placeholder='Review and edit transcript';use.type=again.type='button';use.dataset.target=target;use.classList.add('voice-use');again.classList.add('voice-rerecord');review.append(text,use,again);p.append(status,review);return p}function bindVoice(button,panel){button.onclick=()=>startRecording(panel,button);panel.querySelector('.voice-use').onclick=()=>{const text=panel.querySelector('textarea').value.trim(),target=$(`#${panel.querySelector('.voice-use').dataset.target}`);if(!text){setVoiceStatus(panel,'Enter a transcript first.');return}target.value=text;resetVoicePanel(panel);target.focus()};panel.querySelector('.voice-rerecord').onclick=()=>resetVoicePanel(panel)}
function renderEmpty(){const e=element('div','','empty-state'),inside=element('div');inside.append(element('strong','Start a conversation'),element('span','Ask NovaGuide a question to begin.'));e.append(inside);return e}function configureVoice(c,v){c.voice.disabled=!voiceAvailable;c.voice.title=voiceAvailable?'Record a voice message':'Voice input is unavailable';if(!voiceAvailable)c.voice.textContent='Voice unavailable';v.hidden=!voiceAvailable;bindVoice(c.voice,v)}function configureMode(){const fixture=moduleMode==='fixture';$('#new-chat').hidden=fixture;const area=$('#start-area');clear(area);if(fixture){const box=element('section','','start-panel fixture-panel'),title=element('h2','Start a scenario conversation'),select=element('select');for(const s of scenarios){const o=element('option',`${s.id} — ${s.user_text}`);o.value=s.id;select.append(o)}const go=element('button','Start conversation','button');go.onclick=()=>createFixtureConversation(select.value);box.append(title,select,go);area.append(box);return}const box=element('section','','start-panel'),title=element('h2','How can we help?'),copy=element('p','Ask a question about accounts, cards, transfers, or products.','muted'),c=makeComposer('new-text','Message NovaGuide…','Send'),v=makeVoicePanel('new-text');c.send.onclick=async()=>{const d=await sendTurn('/api/conversations',{user_text:c.input.value});if(d)c.input.value=''};c.input.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();c.send.click()}};configureVoice(c,v);box.append(title,copy,c.wrap,v);area.append(box)}
function customerText(text){return String(text||'').replace(/\n?\[Source:[^\]]+\]/g,'').trim()}function renderResponse(m){const response=m.response||{},info=response.message||{kind:'technical_error',text:m.content},row=element('article','',`message assistant ${info.kind||'technical_error'}`),body=element('div','','message-body'),cardKinds=['clarification','escalation','complaint','blocked','abstention','recommendation'],text=customerText(info.text||m.content);if(cardKinds.includes(info.kind)){const card=element('div','','status-card');card.append(element('div',`NovaGuide · ${kindLabel[info.kind]||'Response'}`,'response-label'),element('div',text));body.append(card)}else body.append(element('div',text));const hints={clarification:'Reply with the requested detail and I will continue.',escalation:'A support handoff has been recorded for this request.',blocked:'No account or product action will be taken from this request.',abstention:'I will not use unverified information to take an account or product action.'};if(hints[info.kind])body.append(element('p',hints[info.kind],'action-hint'));if(Array.isArray(response.citations)&&response.citations.length){const details=element('details','','source-details'),list=element('ul','','source-list');details.append(element('summary','View evidence'));for(const item of response.citations){const entry=element('li','');entry.append(element('strong',item.title),document.createElement('br'),element('span',item.excerpt||item.source));list.append(entry)}details.append(list);body.append(details)}if(Array.isArray(response.recommendations)&&response.recommendations.length){const list=element('ol','','recommendation-list');for(const item of [...response.recommendations].sort((a,b)=>a.rank-b.rank))list.append(element('li',`${item.name} — ${item.reason}`));body.append(element('strong','Options to consider'),list)}row.append(element('div', 'N', 'avatar'),body);return row}function renderMessage(m){if(m.role==='assistant')return renderResponse(m);const row=element('article','','message user');row.append(element('div','Y','avatar'),element('div',m.content,'message-body'));return row}
async function loadConversations(){const d=await request('/api/conversations'),box=$('#conversations');clear(box);if(!d.conversations.length){box.append(element('p','No conversations yet.','muted'));return}for(const c of d.conversations){const b=element('button',c.title,`conversation ${c.id===current?.id?'active':''}`);b.onclick=()=>openConversation(c.id);box.append(b)}}function render(c){current=c;$('#conversation-title').textContent=c.title;const messages=$('#messages');clear(messages);for(const m of c.messages)messages.append(renderMessage(m));$('#start-area').hidden=true;renderRunComposer();void loadConversations();requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}function renderRunComposer(){const dock=$('#run-box');clear(dock);dock.hidden=false;if(moduleMode==='fixture'){const box=element('div','','composer'),select=element('select');for(const s of scenarios){const o=element('option',`${s.id} — ${s.user_text}`);o.value=s.id;select.append(o)}const send=element('button','Send preset input','button');send.onclick=()=>current&&sendTurn(`/api/conversations/${current.id}/messages`,{scenario_id:select.value,expected_version:current.version});box.append(select,send);dock.append(box);return}const c=makeComposer('turn-text','Message NovaGuide…','Send'),v=makeVoicePanel('turn-text');c.send.onclick=async()=>{if(!current)return;const d=await sendTurn(`/api/conversations/${current.id}/messages`,{user_text:c.input.value,expected_version:current.version});if(d)c.input.value=''};c.input.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();c.send.click()}};configureVoice(c,v);dock.append(c.wrap,v)}function beginPending(text){if(!text.trim())return;$('#start-area').hidden=true;$('#run-box').hidden=true;const messages=$('#messages'),pending=element('article','', 'message assistant pending');pending.id='pending-response';pending.append(element('div', 'N', 'avatar'),element('div','NovaGuide is thinking…','message-body'));messages.append(renderMessage({role:'user',content:text.trim()}),pending);requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}function clearPending(){document.querySelector('#pending-response')?.remove()}async function openConversation(id){try{render((await request(`/api/conversations/${id}`)).conversation)}catch(e){showError(e.message)}}async function sendTurn(url,payload){const text=typeof payload.user_text==='string'?payload.user_text:'';if(text)beginPending(text);try{showError();const d=await request(url,{method:'POST',body:JSON.stringify(payload)});clearPending();render(d.conversation);return d}catch(e){clearPending();if(e.message==='conversation_version_conflict'&&current){try{await openConversation(current.id);showError(e.message)}catch(refresh){showError(refresh.message)}}else showError(e.message);return null}}
function setVoiceStatus(p,t){p.querySelector('.voice-status').textContent=t}function resetVoicePanel(p){p.querySelector('.voice-review').hidden=true;p.querySelector('textarea').value='';setVoiceStatus(p,'')}function stopTracks(){if(recordStream)for(const t of recordStream.getTracks())t.stop();recordStream=null}function wavFromFloatSamples(samples,rate=16000){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b),w=(o,x)=>v.setUint8(o,x.charCodeAt(0));for(const [o,x]of [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']])for(let j=0;j<x.length;j++)w(o+j,x[j]);v.setUint32(4,36+samples.length*2,true);v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++){const x=Math.max(-1,Math.min(1,samples[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}return new Blob([b],{type:'audio/wav'})}async function toWav(blob){const encoded=await blob.arrayBuffer(),context=new AudioContext(),decoded=await context.decodeAudioData(encoded);if(decoded.duration>60)throw Error('audio_too_long');const offline=new OfflineAudioContext(1,Math.ceil(decoded.duration*16000),16000),source=offline.createBufferSource();source.buffer=decoded;source.connect(offline.destination);source.start();const rendered=await offline.startRendering();await context.close();return wavFromFloatSamples(rendered.getChannelData(0))}async function uploadRecording(p,blob){setVoiceStatus(p,'Converting recording to 16 kHz WAV…');try{const wav=await toWav(blob);if(wav.size>10*1024*1024)throw Error('audio_too_large');setVoiceStatus(p,'Transcribing locally…');const r=await request('/api/transcriptions',{method:'POST',body:wav,headers:{'Content-Type':'audio/wav'},json:false});if(r.status!=='OK'){setVoiceStatus(p,r.status==='EMPTY'?'No confirmed speech was detected. Please record again.':`Transcription did not complete: ${userFacingError[r.error_code]||'Voice transcription is unavailable.'}`);return}p.querySelector('.voice-review').hidden=false;p.querySelector('textarea').value=r.text;setVoiceStatus(p,'Review or edit the transcript before using it.');p.querySelector('textarea').focus()}catch(e){setVoiceStatus(p,`Unable to transcribe: ${userFacingError[e.message]||'Please try again.'}`)}}async function startRecording(p,b){if(!voiceAvailable||recorder)return;resetVoicePanel(p);try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(recordStream);recordParts=[];recorder.ondataavailable=e=>{if(e.data.size)recordParts.push(e.data)};recorder.onstop=async()=>{clearTimeout(recordingTimer);const blob=new Blob(recordParts,{type:recorder.mimeType||'audio/webm'});recorder=null;stopTracks();b.textContent='Voice';b.classList.remove('recording');b.onclick=()=>startRecording(p,b);await uploadRecording(p,blob)};recorder.start();setVoiceStatus(p,'Recording (up to 60 seconds). Select Voice again to stop.');b.textContent='Stop';b.classList.add('recording');b.onclick=()=>recorder?.stop();recordingTimer=setTimeout(()=>recorder?.stop(),60000)}catch(e){stopTracks();setVoiceStatus(p,`Unable to use the microphone: ${e.message}`)}}
async function loadScenarios(){scenarios=(await request('/api/scenarios')).scenarios}async function loadConfig(){const c=await request('/api/config');moduleMode=c.module_mode||'production';syntheticProfiles=c.synthetic_profiles||[];voiceAvailable=c.voice_input_available===true;renderProfiles()}function setRegistrationMode(active){registering=active;$('#profile-picker').hidden=!active;$('#register').textContent=active?'Confirm account creation':'Create account'}function showConversationLoadFallback(){const box=$('#conversations');clear(box);box.append(element('p','Past conversations are unavailable right now.','muted'))}async function signedIn(){const me=await request('/api/me');try{await loadConfig()}catch{moduleMode='production';voiceAvailable=false}const p=syntheticProfiles.find(i=>i.id===me.user.synthetic_profile_key);$('#who').textContent=p?`${me.user.username} · ${p.label}`:me.user.username;$('#auth').hidden=true;$('#app').style.display='block';if(moduleMode==='fixture'){try{await loadScenarios()}catch{scenarios=[]}}configureMode();if(!current){$('#messages').replaceChildren(renderEmpty());$('#run-box').hidden=true}try{await loadConversations()}catch{showConversationLoadFallback()}}async function credentials(endpoint){showError();try{const v={username:$('#username').value,password:$('#password').value};if(endpoint.endsWith('register'))v.synthetic_profile_key=selectedProfileId;await request(endpoint,{method:'POST',body:JSON.stringify(v)});if(endpoint.endsWith('register')){await request('/api/auth/login',{method:'POST',body:JSON.stringify({username:v.username,password:v.password})});setRegistrationMode(false)}await signedIn()}catch(e){showError(e.message)}}async function createFixtureConversation(id){try{const c=(await request('/api/conversations',{method:'POST',body:JSON.stringify({scenario_id:id})})).conversation;await openConversation(c.id)}catch(e){showError(e.message)}}
$('#login').onclick=()=>{setRegistrationMode(false);credentials('/api/auth/login')};$('#register').onclick=()=>{if(!registering){setRegistrationMode(true);return}credentials('/api/auth/register')};$('#logout').onclick=async()=>{await request('/api/auth/logout',{method:'POST',body:'{}'});current=null;setRegistrationMode(false);$('#app').style.display='none';$('#auth').hidden=false};$('#new-chat').onclick=()=>{current=null;$('#conversation-title').textContent='New conversation';$('#messages').replaceChildren(renderEmpty());$('#start-area').hidden=false;$('#run-box').hidden=true;configureMode();void loadConversations()};(async()=>{try{await loadConfig();await signedIn()}catch{}})();
function recommendationName(name){return String(name||'').replace(/^(?:demo|synthetic)\s+/i,'').trim()}function renderCustomerResponse(m){const response=m.response||{},info=response.message||{kind:'technical_error',text:m.content},row=element('article','',`message assistant ${info.kind||'technical_error'}`),body=element('div','','message-body'),cardKinds=['clarification','escalation','complaint','blocked','abstention','recommendation'],text=info.kind==='recommendation'?'Here are product options that may suit your request.':customerText(info.text||m.content);if(cardKinds.includes(info.kind)){const card=element('div','','status-card');card.append(element('div',`NovaGuide · ${kindLabel[info.kind]||'Response'}`,'response-label'),element('div',text));body.append(card)}else body.append(element('div',text));const hints={clarification:'Reply with the requested detail and I will continue.',escalation:'A support handoff has been recorded for this request.',blocked:'No account or product action will be taken from this request.',abstention:'I will not use unverified information to take an account or product action.'};if(hints[info.kind])body.append(element('p',hints[info.kind],'action-hint'));if(Array.isArray(response.citations)&&response.citations.length){const details=element('details','','source-details'),list=element('ul','','source-list');details.append(element('summary','View evidence'));for(const item of response.citations){const entry=element('li','');entry.append(element('strong',item.title),document.createElement('br'),element('span',item.excerpt||item.source));list.append(entry)}details.append(list);body.append(details)}if(Array.isArray(response.recommendations)&&response.recommendations.length){const list=element('ol','','recommendation-list');for(const item of [...response.recommendations].sort((a,b)=>a.rank-b.rank))list.append(element('li',recommendationName(item.name)));body.append(element('strong','Options to consider'),list)}row.append(element('div', 'N', 'avatar'),body);return row}renderResponse=renderCustomerResponse;
