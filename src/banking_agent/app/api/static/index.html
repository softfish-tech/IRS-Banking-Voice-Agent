<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeBank · Local Agent Lab</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color:#172033; background:#f4f7fb; } body { margin:0; } main { max-width:1020px; margin:auto; padding:32px 20px 60px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem,6vw,3.4rem); } h2 { margin-top:0; } p { color:#536078; line-height:1.5; } .notice { border-left:4px solid #ed9a20; background:#fff8e7; padding:12px 16px; border-radius:4px; }
    .card { margin-top:18px; background:#fff; border:1px solid #dde4f0; border-radius:16px; padding:22px; box-shadow:0 8px 25px #2533550d; } label { font-weight:700; display:block; margin:10px 0 6px; } input,select,button { box-sizing:border-box; font:inherit; padding:11px; border-radius:8px; } input,select { width:100%; border:1px solid #adb9cd; } button { border:0; background:#165dba; color:#fff; font-weight:700; cursor:pointer; margin-top:14px; } button.secondary { background:#e7edf7; color:#172033; margin-left:8px; } button:disabled { opacity:.55; cursor:wait; }
    #app { display:none; } .layout { display:grid; grid-template-columns:260px 1fr; gap:18px; margin-top:18px; } .conversation { display:block; width:100%; text-align:left; margin:0 0 8px; background:#f0f4fa; color:#172033; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .conversation.active { background:#165dba; color:#fff; } .message { padding:12px; border-radius:10px; margin:10px 0; white-space:pre-wrap; } .user { background:#e8f1ff; } .assistant { background:#f5f7fa; } .meta { font-size:.85rem; color:#536078; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; } .metric { background:#eef4fc; border-radius:8px; padding:9px; } .metric span { display:block; font-size:.75rem; color:#536078; } .metric strong { overflow-wrap:anywhere; } #error { color:#a01b1b; font-weight:700; } @media (max-width:700px) { .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body><main>
  <header><h1>SafeBank 本地 Agent Lab</h1><p>合成账户、历史会话与 S01–S08 受控 mock 流程。</p></header>
  <div class="notice">仅本地开发：请勿输入真实姓名、账户、身份证、密码或交易资料。此应用不会连接银行系统。</div>
  <p id="error" role="alert"></p>
  <section class="card" id="auth"><h2>注册或登录</h2><label>用户名<input id="username" autocomplete="username" placeholder="至少 3 个安全字符"></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="至少 6 个字符"></label><button id="login">登录</button><button class="secondary" id="register">创建本地账户</button></section>
  <section id="app"><div class="card"><strong id="who"></strong><button class="secondary" id="logout">退出</button></div><div class="layout"><aside class="card"><h2>会话</h2><label>创建场景会话<select id="scenario"></select></label><button id="create">新建会话</button><div id="conversations" style="margin-top:18px"></div></aside><section class="card"><h2 id="conversation-title">选择或创建会话</h2><div id="state" class="grid"></div><div id="messages"></div><div id="run-box" style="display:none"><label>运行本场景的一轮 mock 流程<select id="turn-scenario"></select></label><button id="run">发送预设输入</button></div></section></div></section>
</main><script>
const $=s=>document.querySelector(s), error=$('#error'); let scenarios=[], current=null;
async function request(url, options={}) { const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}); const d=await r.json(); if(!r.ok) throw Error(d.error||'request_failed'); return d; }
function showError(e=''){error.textContent=e?`操作失败：${e}`:'';} function options(){return scenarios.map(s=>`<option value="${s.id}">${s.id} — ${s.user_text}</option>`).join('');} function metric(k,v){return `<div class="metric"><span>${k}</span><strong>${v||'—'}</strong></div>`;}
async function loadScenarios(){scenarios=(await request('/api/scenarios')).scenarios; $('#scenario').innerHTML=options(); $('#turn-scenario').innerHTML=options();}
async function loadConversations(){const d=await request('/api/conversations'); const box=$('#conversations'); box.innerHTML=d.conversations.length?d.conversations.map(c=>`<button class="conversation ${c.id===current?.id?'active':''}" data-id="${c.id}">${c.title}</button>`).join(''):'<p>还没有会话。</p>'; box.querySelectorAll('button').forEach(b=>b.onclick=()=>openConversation(b.dataset.id));}
function render(c){current=c; $('#conversation-title').textContent=c.title; $('#state').innerHTML=metric('投诉',c.complaint_status)+metric('转人工',c.handoff_status)+metric('同意',c.consent); $('#messages').innerHTML=c.messages.map(m=>`<div class="message ${m.role}"><strong>${m.role==='user'?'你':'SafeBank'}</strong><br>${m.content}</div>`).join(''); $('#run-box').style.display='block'; loadConversations();}
async function openConversation(id){try{render((await request(`/api/conversations/${id}`)).conversation);}catch(e){showError(e.message);}}
async function signedIn(){const me=await request('/api/me'); $('#who').textContent=`已登录：${me.user.username}`; $('#auth').style.display='none'; $('#app').style.display='block'; await loadScenarios(); await loadConversations();}
async function credentials(endpoint){showError(); try {const credentials={username:$('#username').value,password:$('#password').value}; await request(endpoint,{method:'POST',body:JSON.stringify(credentials)}); if(endpoint.endsWith('register')) await request('/api/auth/login',{method:'POST',body:JSON.stringify(credentials)}); await signedIn();} catch(e){showError(e.message);}}
$('#login').onclick=()=>credentials('/api/auth/login'); $('#register').onclick=()=>credentials('/api/auth/register');
$('#logout').onclick=async()=>{await request('/api/auth/logout',{method:'POST',body:'{}'}); current=null; $('#app').style.display='none'; $('#auth').style.display='block';};
$('#create').onclick=async()=>{try{const c=(await request('/api/conversations',{method:'POST',body:JSON.stringify({scenario_id:$('#scenario').value})})).conversation; await openConversation(c.id);}catch(e){showError(e.message);}};
$('#run').onclick=async()=>{if(!current)return; try{const d=await request(`/api/conversations/${current.id}/messages`,{method:'POST',body:JSON.stringify({scenario_id:$('#turn-scenario').value})}); render(d.conversation);}catch(e){showError(e.message);}};
(async()=>{try{await signedIn();}catch{}})();
</script></body></html>
