<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SafeBank · Local Agent Lab</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172033;background:#f4f7fb}body{margin:0}main{max-width:1060px;margin:auto;padding:32px 20px 60px}h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.4rem)}h2{margin-top:0}p{color:#536078;line-height:1.5}.notice{border-left:4px solid #ed9a20;background:#fff8e7;padding:12px 16px;border-radius:4px}.card{margin-top:18px;background:#fff;border:1px solid #dde4f0;border-radius:16px;padding:22px;box-shadow:0 8px 25px #2533550d}label{font-weight:700;display:block;margin:10px 0 6px}input,select,textarea,button{box-sizing:border-box;font:inherit;padding:11px;border-radius:8px}input,select,textarea{width:100%;border:1px solid #adb9cd}textarea{min-height:96px;resize:vertical}button{border:0;background:#165dba;color:#fff;font-weight:700;cursor:pointer;margin-top:14px}button.secondary{background:#e7edf7;color:#172033;margin-left:8px}button.danger{background:#a01b1b}button:disabled{opacity:.55;cursor:wait}#app{display:none}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;margin-top:18px}.conversation{display:block;width:100%;text-align:left;margin:0 0 8px;background:#f0f4fa;color:#172033;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation.active{background:#165dba;color:#fff}.message{padding:12px;border-radius:10px;margin:10px 0;white-space:pre-wrap}.user{background:#e8f1ff}.assistant{background:#f5f7fa;border-left:4px solid #7896be}.assistant.escalation,.assistant.blocked{border-left-color:#a01b1b}.assistant.clarification{border-left-color:#a86d00}.assistant.recommendation{border-left-color:#197a56}.meta{font-size:.85rem;color:#536078}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.metric{background:#eef4fc;border-radius:8px;padding:9px}.metric span{display:block;font-size:.75rem;color:#536078}.metric strong{overflow-wrap:anywhere}#error{color:#a01b1b;font-weight:700}.response-label{font-size:.8rem;font-weight:800;letter-spacing:.04em;color:#536078}.source-list,.recommendation-list{margin:10px 0 0;padding-left:20px;white-space:normal}.voice-panel{margin-top:12px;padding:12px;border:1px dashed #7896be;border-radius:10px;background:#f7faff}.voice-status{display:block;margin-top:8px;color:#536078}.voice-review{margin-top:10px}.action-hint{margin:8px 0 0;color:#536078;font-size:.9rem}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><main>
<header><h1>SafeBank 本地 Agent Lab</h1><p id="mode-description">合成账户、历史会话与 S01–S08 受控 mock 流程。</p></header><div class="notice">仅本地开发：请勿输入真实姓名、账户、身份证、密码或交易资料。此应用不会连接银行系统。</div><p id="error" role="alert"></p>
<section class="card" id="auth"><h2>注册或登录</h2><label>用户名<input id="username" autocomplete="username" placeholder="至少 3 个安全字符"></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="至少 6 个字符"></label><label>合成演示 profile（仅创建账户时选择）<select id="synthetic-profile"></select></label><p class="meta">该 profile 是本地测试角色；创建后会固定到该账户及其新建会话。</p><button id="login">登录</button><button class="secondary" id="register">创建本地账户</button></section>
<section id="app"><div class="card"><strong id="who"></strong><button class="secondary" id="logout">退出</button></div><div class="layout"><aside class="card"><h2>会话</h2><div id="fixture-create"><label>创建场景会话<select id="scenario"></select></label><button id="create">新建会话</button></div><div id="production-create" hidden><label>开始新会话<textarea id="new-text" maxlength="2000" placeholder="输入合成测试咨询（最多 2000 字符）"></textarea></label><button id="create-production">发送首条消息</button><div class="voice-panel" id="voice-new" hidden><button class="secondary voice-start" data-target="new-text">录制语音</button><span class="voice-status"></span><div class="voice-review" hidden><label>请检查并编辑转写<textarea class="voice-transcript" maxlength="2000"></textarea></label><button class="voice-use" data-target="new-text">使用此文本</button><button class="secondary voice-rerecord">重新录制</button></div></div></div><div id="conversations" style="margin-top:18px"></div></aside><section class="card"><h2 id="conversation-title">选择或创建会话</h2><div id="state" class="grid"></div><div id="messages" aria-live="polite"></div><div id="run-box" hidden><div id="fixture-run"><label>运行本场景的一轮 mock 流程<select id="turn-scenario"></select></label><button id="run">发送预设输入</button></div><div id="production-run" hidden><label>发送消息<textarea id="turn-text" maxlength="2000" placeholder="输入合成测试咨询（最多 2000 字符）"></textarea></label><button id="run-production">发送消息</button><div class="voice-panel" id="voice-turn" hidden><button class="secondary voice-start" data-target="turn-text">录制语音</button><span class="voice-status"></span><div class="voice-review" hidden><label>请检查并编辑转写<textarea class="voice-transcript" maxlength="2000"></textarea></label><button class="voice-use" data-target="turn-text">使用此文本</button><button class="secondary voice-rerecord">重新录制</button></div></div></div></div></section></div></section>
</main><script>
const $=s=>document.querySelector(s),error=$('#error');let scenarios=[],syntheticProfiles=[],current=null,moduleMode='fixture',voiceAvailable=false,recorder=null,recordStream=null,recordParts=[],recordingTimer=null;
const kindLabel={answer:'答复',complaint:'投诉处理',escalation:'人工协助',clarification:'需要澄清',blocked:'无法协助',abstention:'暂不确定',recommendation:'推荐',technical_error:'技术问题'};
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}function element(name,text='',className=''){const n=document.createElement(name);if(text)n.textContent=text;if(className)n.className=className;return n}async function request(url,options={}){const headers=new Headers(options.headers||{});if(options.json!==false&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');const r=await fetch(url,{...options,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'request_failed');return d}function showError(message=''){error.textContent=message?`操作失败：${message}`:''}function appendOptions(select,items,label){clear(select);for(const item of items){const option=document.createElement('option');option.value=item.id;option.textContent=label(item);select.append(option)}}function renderProfiles(){appendOptions($('#synthetic-profile'),syntheticProfiles,p=>p.label)}async function loadScenarios(){scenarios=(await request('/api/scenarios')).scenarios;appendOptions($('#scenario'),scenarios,s=>`${s.id} — ${s.user_text}`);appendOptions($('#turn-scenario'),scenarios,s=>`${s.id} — ${s.user_text}`)}
function configureMode(){const fixture=moduleMode==='fixture';$('#fixture-create').hidden=!fixture;$('#production-create').hidden=fixture;$('#fixture-run').hidden=!fixture;$('#production-run').hidden=fixture;$('#mode-description').textContent=fixture?'合成账户、历史会话与 S01–S08 受控 mock 流程。':'注入 adapter 的自由文本测试通路；仅可使用合成测试数据。';for(const panel of document.querySelectorAll('.voice-panel'))panel.hidden=fixture||!voiceAvailable}function metric(label,value){const box=element('div','','metric');box.append(element('span',label),element('strong',value||'—'));return box}
function renderResponse(message){const response=message.response||{},info=response.message||{kind:'technical_error',text:message.content},box=element('article','',`message assistant ${info.kind||'technical_error'}`);box.append(element('div',`SafeBank · ${kindLabel[info.kind]||'回复'}`,'response-label'),element('div',info.text||message.content));const hints={clarification:'请补充所需信息后再发送。',escalation:'此请求已按安全流程转交处理。',blocked:'不会据此执行任何账户或产品操作。',abstention:'不会据此执行任何账户或产品操作。'};if(hints[info.kind])box.append(element('p',hints[info.kind],'action-hint'));if(Array.isArray(response.citations)&&response.citations.length){const list=element('ul','source-list');for(const item of response.citations)list.append(element('li',`${item.title} · ${item.source}`));box.append(element('strong','参考资料'),list)}if(Array.isArray(response.recommendations)&&response.recommendations.length){const list=element('ol','recommendation-list');for(const item of [...response.recommendations].sort((a,b)=>a.rank-b.rank))list.append(element('li',`${item.name} — ${item.reason}`));box.append(element('strong','可考虑的产品'),list)}return box}function renderMessage(message){if(message.role==='assistant')return renderResponse(message);const box=element('article','message user');box.append(element('strong','你'),document.createElement('br'),document.createTextNode(message.content));return box}
async function loadConversations(){const d=await request('/api/conversations'),box=$('#conversations');clear(box);if(!d.conversations.length){box.append(element('p','还没有会话。'));return}for(const conversation of d.conversations){const button=element('button',conversation.title,`conversation ${conversation.id===current?.id?'active':''}`);button.onclick=()=>openConversation(conversation.id);box.append(button)}}function render(conversation){current=conversation;$('#conversation-title').textContent=conversation.title;const state=$('#state');clear(state);state.append(metric('投诉',conversation.complaint_status),metric('转人工',conversation.handoff_status),metric('同意',conversation.consent));const messages=$('#messages');clear(messages);for(const message of conversation.messages)messages.append(renderMessage(message));$('#run-box').hidden=false;configureMode();void loadConversations()}async function openConversation(id){try{render((await request(`/api/conversations/${id}`)).conversation)}catch(e){showError(e.message)}}async function loadConfig(){const config=await request('/api/config');moduleMode=config.module_mode;syntheticProfiles=config.synthetic_profiles||[];voiceAvailable=config.voice_input_available===true;renderProfiles();configureMode()}async function signedIn(){const me=await request('/api/me');await loadConfig();$('#who').textContent=`已登录：${me.user.username}`;$('#auth').hidden=true;$('#app').style.display='block';if(moduleMode==='fixture')await loadScenarios();await loadConversations()}
async function credentials(endpoint){showError();try{const credentials={username:$('#username').value,password:$('#password').value};if(endpoint.endsWith('register'))credentials.synthetic_profile_key=$('#synthetic-profile').value;await request(endpoint,{method:'POST',body:JSON.stringify(credentials)});if(endpoint.endsWith('register'))await request('/api/auth/login',{method:'POST',body:JSON.stringify({username:credentials.username,password:credentials.password})});await signedIn()}catch(e){showError(e.message)}}async function sendTurn(url,payload){try{const d=await request(url,{method:'POST',body:JSON.stringify(payload)});render(d.conversation);return d}catch(e){if(e.message==='conversation_version_conflict'&&current){try{await openConversation(current.id);showError('会话已在其他请求中更新，请确认最新内容后重新发送。')}catch(refresh){showError(refresh.message)}}else showError(e.message);return null}}
function setVoiceStatus(panel,text){panel.querySelector('.voice-status').textContent=text}function resetVoicePanel(panel){panel.querySelector('.voice-review').hidden=true;panel.querySelector('.voice-transcript').value='';setVoiceStatus(panel,'')}function stopTracks(){if(recordStream)for(const track of recordStream.getTracks())track.stop();recordStream=null}function wavFromFloatSamples(samples,rate=16000){const buffer=new ArrayBuffer(44+samples.length*2),view=new DataView(buffer),write=(offset,value)=>view.setUint8(offset,value.charCodeAt(0));for(const [offset,value]of [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']])for(let j=0;j<value.length;j++)write(offset+j,value[j]);view.setUint32(4,36+samples.length*2,true);view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);view.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++){const value=Math.max(-1,Math.min(1,samples[i]));view.setInt16(44+i*2,value<0?value*0x8000:value*0x7fff,true)}return new Blob([buffer],{type:'audio/wav'})}async function toWav(blob){const encoded=await blob.arrayBuffer(),context=new AudioContext(),decoded=await context.decodeAudioData(encoded);if(decoded.duration>60)throw Error('audio_too_long');const offline=new OfflineAudioContext(1,Math.ceil(decoded.duration*16000),16000),source=offline.createBufferSource();source.buffer=decoded;source.connect(offline.destination);source.start();const rendered=await offline.startRendering();await context.close();return wavFromFloatSamples(rendered.getChannelData(0))}
async function uploadRecording(panel,blob){setVoiceStatus(panel,'正在将录音转换为 16 kHz WAV…');try{const wav=await toWav(blob);if(wav.size>10*1024*1024)throw Error('audio_too_large');setVoiceStatus(panel,'正在本机 ASR 转写…');const result=await request('/api/transcriptions',{method:'POST',body:wav,headers:{'Content-Type':'audio/wav'},json:false});if(result.status!=='OK'){setVoiceStatus(panel,result.status==='EMPTY'?'未检测到可确认的语音，请重新录制。':`转写未完成：${result.error_code||'asr_unavailable'}`);return}const review=panel.querySelector('.voice-review');review.hidden=false;panel.querySelector('.voice-transcript').value=result.text;setVoiceStatus(panel,'请检查或编辑转写内容；确认后才会发送。');panel.querySelector('.voice-transcript').focus()}catch(e){setVoiceStatus(panel,`无法转写：${e.message}`)}}async function startRecording(panel){if(!voiceAvailable||recorder)return;resetVoicePanel(panel);try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(recordStream);recordParts=[];recorder.ondataavailable=e=>{if(e.data.size)recordParts.push(e.data)};recorder.onstop=async()=>{clearTimeout(recordingTimer);const blob=new Blob(recordParts,{type:recorder.mimeType||'audio/webm'});recorder=null;stopTracks();const start=panel.querySelector('.voice-start');start.textContent='录制语音';start.classList.remove('danger');start.onclick=()=>startRecording(panel);await uploadRecording(panel,blob)};recorder.start();setVoiceStatus(panel,'正在录音（最长 60 秒）。再次点击停止录音。');const start=panel.querySelector('.voice-start');start.textContent='停止录音';start.classList.add('danger');start.onclick=()=>recorder?.stop();recordingTimer=setTimeout(()=>recorder?.stop(),60000)}catch(e){stopTracks();setVoiceStatus(panel,`无法使用麦克风：${e.message}`)}}
for(const button of document.querySelectorAll('.voice-start'))button.onclick=()=>startRecording(button.closest('.voice-panel'));for(const button of document.querySelectorAll('.voice-rerecord'))button.onclick=()=>resetVoicePanel(button.closest('.voice-panel'));for(const button of document.querySelectorAll('.voice-use'))button.onclick=()=>{const panel=button.closest('.voice-panel'),text=panel.querySelector('.voice-transcript').value.trim(),target=$(`#${button.dataset.target}`);if(!text){setVoiceStatus(panel,'请先填写可确认的文本。');return}target.value=text;resetVoicePanel(panel);target.focus()};$('#login').onclick=()=>credentials('/api/auth/login');$('#register').onclick=()=>credentials('/api/auth/register');$('#logout').onclick=async()=>{await request('/api/auth/logout',{method:'POST',body:'{}'});current=null;$('#app').style.display='none';$('#auth').hidden=false};$('#create').onclick=async()=>{try{const c=(await request('/api/conversations',{method:'POST',body:JSON.stringify({scenario_id:$('#scenario').value})})).conversation;await openConversation(c.id)}catch(e){showError(e.message)}};$('#create-production').onclick=async()=>{const d=await sendTurn('/api/conversations',{user_text:$('#new-text').value});if(d)$('#new-text').value=''};$('#run').onclick=async()=>{if(current)await sendTurn(`/api/conversations/${current.id}/messages`,{scenario_id:$('#turn-scenario').value,expected_version:current.version})};$('#run-production').onclick=async()=>{if(!current)return;const d=await sendTurn(`/api/conversations/${current.id}/messages`,{user_text:$('#turn-text').value,expected_version:current.version});if(d)$('#turn-text').value=''};for(const field of document.querySelectorAll('#new-text,#turn-text'))field.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();(field.id==='new-text'?$('#create-production'):$('#run-production')).click()}});(async()=>{try{await loadConfig();await signedIn()}catch{}})();
</script></body></html>
