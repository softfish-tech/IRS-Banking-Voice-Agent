[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-voice-agent"
version = "0.1.0"
description = "A safe, modular banking service-agent prototype."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.0,<3.0",
  "rank-bm25>=0.2.2,<0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"banking_agent.modules.intent" = [
  "model_artifacts/*.json",
  "model_artifacts/*.md",
  "model_artifacts/*.npz",
  "model_artifacts/*.txt",
]
